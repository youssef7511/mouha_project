[package]
name = "packflow-transfer"
version = "1.0.0"
edition = "2021"
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rust_xlsxwriter = "=0.100.0"
calamine = "=0.36.1"
quick-xml = "=0.41.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
