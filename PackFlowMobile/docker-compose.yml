services:
  core:
    image: rust:1.99-bookworm
    working_dir: /workspace
    command: cargo run --locked -p packflow-mobile-core --features preview --bin mobile-preview
    environment:
      PACKFLOW_MOBILE_DATA: /data
      PACKFLOW_MOBILE_BIND: 0.0.0.0:4328
      CARGO_TARGET_DIR: /build
    ports: ["127.0.0.1:4328:4328"]
    volumes: [".:/workspace", "./.dev-data:/data", "cargo:/usr/local/cargo/registry", "build:/build"]
  core-test:
    image: rust:1.99-bookworm
    working_dir: /workspace
    command: cargo test --locked -p packflow-mobile-core
    environment: { CARGO_TARGET_DIR: /build }
    volumes: [".:/workspace", "cargo:/usr/local/cargo/registry", "build:/build"]
    profiles: [test]
  core-e2e:
    image: rust:1.99-bookworm
    working_dir: /workspace
    command: cargo run --locked -p packflow-mobile-core --features preview --bin mobile-preview
    environment: { PACKFLOW_MOBILE_DATA: /test-data, PACKFLOW_MOBILE_BIND: "0.0.0.0:4328", CARGO_TARGET_DIR: /build }
    ports: ["127.0.0.1:4329:4328"]
    tmpfs: [/test-data]
    volumes: [".:/workspace", "cargo:/usr/local/cargo/registry", "build:/build"]
    profiles: [test]
  native-check:
    build:
      context: .
      dockerfile: scripts/Dockerfile.native-check
    working_dir: /workspace
    command: cargo check --locked -p packflow-mobile
    environment: { CARGO_TARGET_DIR: /native-build, RUSTUP_TOOLCHAIN: "1.99.0-x86_64-unknown-linux-gnu" }
    volumes: [".:/workspace", "cargo:/usr/local/cargo/registry", "native-build:/native-build"]
    profiles: [test]
volumes:
  cargo:
  build:
  native-build:
